name: CodeQL Advanced

on:
  push:
    branches: 
      - 'develop'
    paths:
      - 'XEngine_Source/**'
      - 'XEngine_Release/**'
      - '.github/**'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
          ref: 'develop'
          
    - name: sub module checkout (opensource)
      run: |
          git submodule init
          git submodule update

    - name: Set TERM variable
      run: echo "TERM=xterm" >> $GITHUB_ENV
      
    - name: Set up Dependency Environment
      run: |
          latest_tag=$(curl -s https://api.github.com/repos/libxengine/libxengine/releases/latest | jq -r .tag_name)
          wget https://github.com/libxengine/libxengine/releases/download/$latest_tag/XEngine_UBuntu_24.04_x86-64.zip
          unzip ./XEngine_UBuntu_24.04_x86-64.zip -d ./XEngine_UBuntu_24.04_x86-64
          cd XEngine_UBuntu_24.04_x86-64
            
          chmod 777 *
          sudo ./XEngine_LINEnv.sh -i 3

    - name: make pre
      run: | 
          cd XEngine_Source
          make BUILDTYPE=1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: manual 
        queries: security-and-quality
        
    - name: make check
      run: | 
          cd XEngine_Source
          make BUILDTYPE=2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
