name: freebsd build workflows

on:
  push:
    branches:
      - 'develop'
    paths:
      - 'XEngine_Source/**'
      - 'XEngine_Release/**'
      - '.github/**'
  
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            freebsd-arch: x86_64
            artifact: x86-64
            version: 15.1
          - arch: arm64
            runner: ubuntu-24.04-arm
            freebsd-arch: aarch64
            artifact: Arm64
            version: 15.1

    steps:
      - name: Checkout main repository code
        uses: actions/checkout@v7
        
      - name: sub module checkout (opensource)
        uses: actions/checkout@v7
        with:
          repository: libxengine/XEngine_OPenSource
          path: XEngine_Source/XEngine_DependLibrary

      - name: Set TERM variable
        run: echo "TERM=xterm" >> $GITHUB_ENV

      - name: Build in FreeBSD 15
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.version }}
          arch: ${{ matrix.freebsd-arch }}
          usesh: true
          prepare: |
            pkg install -y gcc cmake gmake git pkgconf jq unzip curl wget bash
          run: |
            latest_tag=$(curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/libxengine/libxengine/releases/latest | jq -r .tag_name)
            wget https://github.com/libxengine/libxengine/releases/download/$latest_tag/XEngine_FreeBSD_${{ matrix.version }}_${{ matrix.artifact }}.zip
            unzip ./XEngine_FreeBSD_${{ matrix.version }}_${{ matrix.artifact }}.zip -d ./XEngine_FreeBSD_${{ matrix.version }}_${{ matrix.artifact }}
            cd XEngine_FreeBSD_${{ matrix.version }}_${{ matrix.artifact }}
            
            chmod 777 *
            bash ./XEngine_LINEnv.sh -i 3
            cd ..

            cd XEngine_Source
            gmake PLATFORM=freebsd RELEASE=1
            gmake PLATFORM=freebsd FLAGS=InstallAll
            gmake PLATFORM=freebsd FLAGS=CleanAll
            cd ..

            cd XEngine_Release
            ldd ./XEngine_AuthorizeService
            ./XEngine_AuthorizeService -t

      - name: Upload folder as artifact
        uses: actions/upload-artifact@v7
        with:
          name: XEngine_AuthorizeService-Ubuntu_22.04_x86-64
          path: XEngine_Release/
          retention-days: 1